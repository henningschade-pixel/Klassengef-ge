/* ---------- Datei speichern (Download mit Bestätigung) ---------- */
/* Innerhalb von Claude läuft der Download über dessen eigene claude.use("downloads")-API (mit
   Bestätigungsdialog). Als eigenständige, lokal geöffnete Datei (window.claude existiert dann nicht) gibt
   es diese API nicht – dort läuft der Download stattdessen über einen normalen, unsichtbaren Download-Link,
   wie ihn jeder Browser nativ unterstützt (auch von einer file://-Seite aus). */
async function saveFile(filename, data) {
  if (!window.claude) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.style.display = "none";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    } catch (e) { toast("Die Datei konnte nicht gespeichert werden."); return false; }
  }
  const dl = await claude.use("downloads");
  if (!dl) { toast("Datei-Download ist hier nicht verfügbar."); return false; }
  try { await dl.save({ filename, data }); return true; }
  catch (e) { if (!e || e.code !== "declined") toast("Die Datei konnte nicht gespeichert werden."); return false; }
}

/* ---------- Import: CSV / XML ---------- */
async function readFileText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^﻿/, ""); }
  catch (e) { return new TextDecoder("windows-1252").decode(buf); }
}
function parseCSV(txt) {
  const first = txt.split(/\r?\n/).find(l => l.trim()) || "";
  const cnt = d => first.split(d).length - 1;
  const delim = [";", "\t", ","].sort((a, b) => cnt(b) - cnt(a))[0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && txt[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.some(x => x.trim())) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if (row.some(x => x.trim())) rows.push(row);
  return rows.map(r => r.map(x => x.trim()));
}
const ROLE = {
  name: ["name", "schueler", "schüler", "schülername", "schuelername", "vollername", "vollständigername"],
  first: ["vorname", "rufname", "firstname", "givenname"],
  last: ["nachname", "familienname", "zuname", "lastname", "surname"],
  g: ["geschlecht", "gender", "sex", "mwd", "geschl"],
  y: ["jahrgang", "klasse", "jahrgangsstufe", "klassenstufe", "stufe", "class", "grade", "jg"]
};
const roleOf = key => { const k = String(key).toLowerCase().replace(/[^a-zäöüß]/g, ""); return Object.keys(ROLE).find(r => ROLE[r].includes(k)) || null; };
function normGender(v) {
  const x = String(v || "").trim().toLowerCase();
  if (/^(w|f|weiblich|female|mädchen|maedchen)$/.test(x)) return "w";
  if (/^(m|männlich|maennlich|male|junge)$/.test(x)) return "m";
  if (/^(d|x|divers|diverse)$/.test(x)) return "d";
  return "u";
}
function fromRecord(rec) {
  const o = { name: "", first: "", last: "", g: "", y: "" };
  for (const k in rec) { const r = roleOf(k); if (r) o[r] = String(rec[k]).trim(); }
  let name = o.name || [o.first, o.last].filter(Boolean).join(" ");
  if (o.name && o.name.split(",").length === 2) { const [a, b] = o.name.split(","); name = b.trim() + " " + a.trim(); }
  return { name, g: normGender(o.g), gRaw: o.g, y: parseYear(o.y) };
}
function fromCells(cells) {
  let name = [], g = "", y = "";
  for (const p of cells.filter(Boolean)) {
    if (!g && /^(w|f|m|d|x|weiblich|männlich|maennlich|divers|female|male)$/i.test(p)) g = p;
    else if (y === "" && /^\d{1,2}[a-zA-Z]?$/.test(p)) y = p;
    else name.push(p);

  return { name: name.join(" "), g: normGender(g), gRaw: g, y: parseYear(y) };
}
function parseXML(txt) {
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("xml");
  let best = null, bc = 0;
  for (const el of doc.querySelectorAll("*")) {
    const cnt = {}; for (const ch of el.children) cnt[ch.tagName] = (cnt[ch.tagName] || 0) + 1;
    for (const t in cnt) if (cnt[t] > bc) { bc = cnt[t]; best = [el, t]; }
  }
  if (!best) throw new Error("xml");
  return [...best[0].children].filter(ch => ch.tagName === best[1]).map(rec => {
    const o = {}; for (const a of rec.attributes) o[a.name] = a.value;
    for (const ch of rec.children) o[ch.tagName] = ch.textContent;
    if (!rec.children.length && rec.textContent.trim()) o.name = rec.textContent;
    return fromRecord(o);
  });
}
function parseStudentFile(txt, fname) {
  let rows;
  if (/\.xml$/i.test(fname) || /^\s*<\?xml|^\s*</.test(txt)) rows = parseXML(txt);
  else {
    const t = parseCSV(txt); if (!t.length) throw new Error("leer");
    const hasHead = t[0].some(h => roleOf(h));
    rows = hasHead ? t.slice(1).map(r => { const rec = {}; t[0].forEach((h, i) => rec[h] = r[i] || ""); return fromRecord(rec); }) : t.map(fromCells);
  }
  return rows;
}

/* Schülerliste als Bild/SVG (unabhängig vom Druckdialog, der in mancher Umgebung nicht zur Verfügung steht) */
function buildStudentsExportSvg() {

  });

<text x="${LEFT}" y="30" style="font:700 20px 'Bricolage Grotesque',system-ui,sans-serif;fill:${col("--ink")}">Schülerliste – ${esc(c.name)}</text>
<text x="${LEFT}" y="48" style="font:12px system-ui,sans-serif;fill:${col("--ink2")}">${new Date().toLocaleDateString("de-DE")} · ${c.students.length} Schüler</text>

/* ============ Tab 3: Soziogramm ============ */
const SW = 1000, SH = 620;
const HULL = ["#4c78d8", "#e0873a", "#3fa877", "#a45cc2", "#d3a21f", "#3aa6b9", "#c7527a", "#7a8a3a", "#6b6fd6", "#b8703f"];
const yk = s => (s.y === "" || s.y == null) ? "–" : String(s.y);
let anim = 0;
const numOf = (c, id) => c.students.findIndex(s => s.id === id) + 1;
const nameOf = (c, s) => (ui.f.showName || ui.revealed.has(s.id)) ? short(s.name) : "Nr. " + numOf(c, s.id);

/* --- Kamera (Zoom/Verschieben): eine reine Ansichts-Transformation über den festen Layout-Koordinaten (c.pos).
   Gezoomt/verschoben wird nur, WO die Punkte gezeichnet werden – ihre Größe (Kreis, Schrift, Linien) bleibt
   unverändert, dadurch drücken sich beim Hineinzoomen die Punkte auseinander, statt selbst größer zu werden. */
const SOCIO_ZOOM_MIN = 0.35, SOCIO_ZOOM_MAX = 6, SOCIO_ZOOM_MAX_AUTO = 3;
const socioZ = () => ui.socioZoom || 1;
const socioCam = () => ui.socioPan || (ui.socioPan = { x: SW / 2, y: SH / 2 });
/* Logische Layout-Position -> Bildschirm-/Zeichenposition (im festen SW×SH-Koordinatensystem des SVG) */
function toScreen(p) { const z = socioZ(), cam = socioCam(); return { x: (p.x - cam.x) * z + SW / 2, y: (p.y - cam.y) * z + SH / 2 }; }
/* Umkehrung: Bildschirmposition -> logische Layout-Position (für Ziehen/Verschieben) */
function toLogical(q) { const z = socioZ(), cam = socioCam(); return { x: (q.x - SW / 2) / z + cam.x, y: (q.y - SH / 2) / z + cam.y }; }
/* Kamera, die eine Menge von Schülern (oder – ohne Angabe – alle sichtbaren) mit etwas Rand einrahmt */
function computeFitCamera(ids) {
  const c = cls();
  let pts = (ids || []).map(id => c.pos[id]).filter(Boolean);
  if (!pts.length) pts = c.students.map(s => c.pos[s.id]).filter(Boolean);
  if (!pts.length) return { pan: { x: SW / 2, y: SH / 2 }, zoom: 1 };
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
  const PAD = 100, w = Math.max(1, x1 - x0) + PAD * 2, h = Math.max(1, y1 - y0) + PAD * 2;
  const zoom = Math.max(SOCIO_ZOOM_MIN, Math.min(SOCIO_ZOOM_MAX_AUTO, Math.min(SW / w, SH / h)));
  return { pan: { x: (x0 + x1) / 2, y: (y0 + y1) / 2 }, zoom };
}
let camAnim = 0;
function animateCamera(targetPan, targetZoom) {
  const fromPan = { ...socioCam() }, fromZoom = socioZ(), token = ++camAnim;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { ui.socioPan = targetPan; ui.socioZoom = targetZoom; drawSocio(); return; }
  const t0 = performance.now(), D = 550;
  const step = t => {
    if (token !== camAnim) return;
    const u = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - u, 3);
    ui.socioPan = { x: fromPan.x + (targetPan.x - fromPan.x) * e, y: fromPan.y + (targetPan.y - fromPan.y) * e };
    ui.socioZoom = fromZoom + (targetZoom - fromZoom) * e;
    drawSocio();
    if (u < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* Auto-Zoom: rahmt die aktuelle Auswahl (Schüler und/oder per Gruppenklick übernommene Gruppe) ein; ohne
   Auswahl wird wieder die ganze Klasse eingerahmt. Wird nach jeder Auswahländerung aufgerufen. */
function autoZoomToSelection() {
  const target = computeFitCamera([...ui.sel]);
  animateCamera(target.pan, target.zoom);
}

/* --- Gruppen erkennen (Modularität, lokale Verschiebung, deterministisch) --- */
function detectGroups(n, W) {
  const deg = new Array(n).fill(0); let m2 = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) deg[i] += W[i][j];
  for (const d of deg) m2 += d;
  if (!m2) return [...Array(n).keys()];
  const r = rng(12345); let best = null, bq = -Infinity;
  for (let rs = 0; rs < 30; rs++) {
    const comm = [...Array(n).keys()], tot = deg.slice();
    const order = [...Array(n).keys()].sort(() => r() - .5);
    let moved = true, guard = 0;
    while (moved && guard++ < 60) {
      moved = false;
      for (const i of order) {
        const ci = comm[i]; tot[ci] -= deg[i];
        const kin = new Map();
        for (let j = 0; j < n; j++) if (j !== i && W[i][j]) kin.set(comm[j], (kin.get(comm[j]) || 0) + W[i][j]);
        let bc = ci, bg = (kin.get(ci) || 0) - tot[ci] * deg[i] / m2;
        for (const [cc, w] of kin) { const g = w - tot[cc] * deg[i] / m2; if (g > bg + 1e-9) { bg = g; bc = cc; } }
        comm[i] = bc; tot[bc] += deg[i]; if (bc !== ci) moved = true;
      }
    }
    let q = 0;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (comm[i] === comm[j]) q += W[i][j] - deg[i] * deg[j] / m2;
    q /= m2;
    if (q > bq + 1e-9) { bq = q; best = comm; }
  }
  return best;
}

/* Erkennt Freundes-/Beziehungsgruppen unter den übergebenen Schülern – unabhängig von Beziehungsart-/„nur
   gegenseitige“-Anzeigefiltern, damit die erkannten Untergruppen stabil bleiben. Gemeinsam genutzt vom
   Soziogramm (auf den aktuell sichtbaren Schülern) und der Tischanordnung „aus Soziogramm erzeugen“
   (auf allen Schülern der Klasse). */
function detectRelGroups(c, students) {
  const n = students.length, W = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const p = Math.max(R(c, students[i].id, students[j].id), 0), q = Math.max(R(c, students[j].id, students[i].id), 0);
    W[i][j] = W[j][i] = (p + q) * (p && q ? 1.5 : 1);
  }
  const comm = detectGroups(n, W), byC = new Map();
  comm.forEach((cc, i) => { if (!byC.has(cc)) byC.set(cc, []); byC.get(cc).push(students[i].id); });
  /* Bereinigung: Wer von niemandem in der Gruppe eine (positive) Beziehung empfängt, gehört nicht wirklich dazu –
     sonst landet, wer nur auf jemanden zeigt, ohne selbst gesehen zu werden, fälschlich in dessen Gruppe. Reines
     Zeigen auf mehrere Mitglieder reicht dafür nicht, entscheidend ist, ob mindestens eine eingehende (auch
     gegenseitige) Beziehung aus der Gruppe besteht. Auch das gilt unabhängig von den Anzeigefiltern. */
  const belongsToGroup = (id, members) => {
    for (const other of members) {
      if (other === id) continue;
      if (R(c, other, id) > 0) return true;
    }
    return false;
  };
  let groups = [...byC.values()].map(g => g.filter(id => belongsToGroup(id, g)));
  groups = groups.filter(g => g.length > 1).sort((a, b) => b.length - a.length);
  const groupOf = new Map(); groups.forEach((g, gi) => g.forEach(id => groupOf.set(id, gi)));
  return { groups, groupOf, labelOf: gi => "Gruppe " + (gi + 1) };
}
/* Gruppiert die übergebenen Schüler stattdessen nach einem einzelnen Merkmal (Geschlecht oder Jahrgang) –
   im selben { groups, groupOf, labelOf }-Format wie detectRelGroups, damit Hülle, Beschriftung und
   Anklicken (siehe drawSocio/selectGroup) unabhängig vom Kriterium denselben Code nutzen können. Wird
   verwendet, wenn die aktuell gewählte Anordnung selbst nach diesem Merkmal gruppiert (siehe socioModel). */
function detectCategoryGroups(students, keyOf, labelForKey) {
  const byKey = new Map();
  for (const s of students) { const k = keyOf(s); if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(s.id); }
  const entries = [...byKey.entries()].filter(([, ids]) => ids.length > 1).sort((a, b) => b[1].length - a[1].length);
  const groups = entries.map(([, ids]) => ids);
  const groupOf = new Map(); groups.forEach((g, gi) => g.forEach(id => groupOf.set(id, gi)));
  return { groups, groupOf, labelOf: gi => labelForKey(entries[gi][0]) };
}

/* --- Modell: was ist bei den aktuellen Filtern sichtbar? --- */
function socioModel() {
  const c = cls(), f = ui.f;
  /* Ausgefilterte Schüler werden im Soziogramm grundsätzlich ausgeblendet, daher ist "aktiv" zugleich "sichtbar". */
  const active = c.students.filter(s => f.genders[s.g] !== false && f.years[yk(s)] !== false);
  const pairs = [];
  for (let i = 0; i < active.length; i++) for (let j = i + 1; j < active.length; j++) {
    const a = active[i], b = active[j]; let va = R(c, a.id, b.id), vb = R(c, b.id, a.id);
    if (va && !f.on[va]) va = 0; if (vb && !f.on[vb]) vb = 0;
    if (f.mutual && !(va && vb && Math.sign(va) === Math.sign(vb))) { va = 0; vb = 0; }
    if (va || vb) pairs.push({ a: a.id, b: b.id, va, vb });
  }
  /* Bei „Nach Geschlecht“/„Nach Jahrgang“ sollen genau die Cluster, nach denen auch räumlich angeordnet
     wird (siehe arrangeClusters in runArrange), als anklickbare Gruppe mit Hülle erscheinen – nicht die
     davon unabhängigen Beziehungsgruppen. Bei jeder anderen Anordnung bleibt es bei den Beziehungsgruppen. */
  const mode = ui.layoutMode || "auto";
  const { groups, groupOf, labelOf } = mode === "gender" ? detectCategoryGroups(active, s => s.g, g => GN[g])
    : mode === "year" ? detectCategoryGroups(active, yk, y => y === "–" ? "Ohne Jahrgang" : "Jahrgang " + y)
    : detectRelGroups(c, active);
  return { active, pairs, groups, groupOf, labelOf };
}

/* --- Layout: Kräfte-Simulation mit mehreren Startpunkten, Kreuzungen minimieren --- */
function segX(a, b, c, d) {
  const o = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  const d1 = o(a, b, c), d2 = o(a, b, d), d3 = o(c, d, a), d4 = o(c, d, b);
  return d1 * d2 < 0 && d3 * d4 < 0;
}
function forceLayout(n, pl, gidx, G, seed) {
  const r = rng(seed), k = Math.sqrt(SW * SH / n) * 0.7;
  const px = new Float64Array(n), py = new Float64Array(n), dx = new Float64Array(n), dy = new Float64Array(n);
  const mem = Array.from({ length: G }, () => []); gidx.forEach((g, i) => { if (g >= 0) mem[g].push(i); });
  const a0 = r() * 6.283;
  for (let i = 0; i < n; i++) {
    const g = gidx[i];
    if (g >= 0) { const a = a0 + 6.283 * g / G; px[i] = SW / 2 + Math.cos(a) * SW * .3 + (r() - .5) * k; py[i] = SH / 2 + Math.sin(a) * SH * .3 + (r() - .5) * k; }
    else { const a = r() * 6.283, rr = .15 + .3 * r(); px[i] = SW / 2 + Math.cos(a) * SW * rr; py[i] = SH / 2 + Math.sin(a) * SH * rr; }
  }
  const IT = 450, cxs = new Float64Array(G), cys = new Float64Array(G);
  for (let it = 0; it < IT; it++) {
    const temp = 70 * (1 - it / IT) + 2;
    dx.fill(0); dy.fill(0);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      let ex = px[i] - px[j], ey = py[i] - py[j], d = Math.hypot(ex, ey); if (d < 4) { ex = r() - .5; ey = r() - .5; d = 4; }
      const f = k * k * .5 / d / d; dx[i] += ex * f; dy[i] += ey * f; dx[j] -= ex * f; dy[j] -= ey * f;
    }
    for (const p of pl) {
      const ex = px[p.j] - px[p.i], ey = py[p.j] - py[p.i], d = Math.hypot(ex, ey) || 1, ux = ex / d, uy = ey / d;
      if (p.aw > 0) {
        const d0 = Math.max(78, k * (1.15 - .13 * Math.min(p.aw, 6)));
        if (d > d0) { const f = .06 * (d - d0) * (.6 + p.aw * .25); dx[p.i] += ux * f; dy[p.i] += uy * f; dx[p.j] -= ux * f; dy[p.j] -= uy * f; }
      }
      if (p.nw > 0) {
        const dn = k * 1.9;
        if (d < dn) { const f = .09 * (dn - d) * p.nw; dx[p.i] -= ux * f; dy[p.i] -= uy * f; dx[p.j] += ux * f; dy[p.j] += uy * f; }
      }
    }
    for (let g = 0; g < G; g++) { let sx = 0, sy = 0; for (const i of mem[g]) { sx += px[i]; sy += py[i]; } cxs[g] = sx / mem[g].length; cys[g] = sy / mem[g].length; }
    for (let g = 0; g < G; g++) {
      for (const i of mem[g]) { dx[i] += .05 * (cxs[g] - px[i]); dy[i] += .05 * (cys[g] - py[i]); }
      for (let h = g + 1; h < G; h++) {
        let ex = cxs[g] - cxs[h], ey = cys[g] - cys[h], d = Math.hypot(ex, ey) || 1;

  for (const a of ids) for (const b of ids) if (a !== b) { const v = R(c, a, b); if (v > 0) { rp[b]++; pop[b] += v; } else if (v < 0) rn[b]++; }
  ui.pop = pop;

  /* Die Auswertung (Zuneigung/Abneigung erhalten, Zufriedenheit, Ø Beziehungswert …) bezieht sich immer
     auf die "Grundlage": die aktuelle Auswahl, wenn es eine gibt (einzeln markiert oder per Gruppenklick),
     sonst alle sichtbaren Schüler – siehe socioSide(). Bei zwei oder mehr Personen in der Grundlage zählen
     nur Beziehungen ZWISCHEN ihnen (wie bei den Kanten im Diagramm, siehe drawSocio). Bei genau einer
     ausgewählten Person gibt es keine "Beziehung innerhalb der Auswahl" – dort zeigt die Auswertung
     stattdessen deren eigenes Beziehungsnetz zur ganzen Klasse (identisch zu rp/rn oben). Die Knotengröße
     oben ("Größe = erhaltene Zuneigung", rp/pop) bleibt bewusst unabhängig von der Auswahl, da sie das

  if (selIds.length === 1) {
    const x = selIds[0];
    scope = [x]; srp = { [x]: rp[x] }; srn = { [x]: rn[x] }; sMutual = 0; relVals = [];
    for (const o of ids) { if (o === x) continue; const va = R(c, x, o), vb = R(c, o, x); if (va > 0 && vb > 0) sMutual++; if (va) relVals.push(va); if (vb) relVals.push(vb); }
  } else {

    for (const id of scope) { srp[id] = 0; srn[id] = 0; }
    for (const a of scope) for (const b of scope) if (a !== b) { const v = R(c, a, b); if (v > 0) srp[b]++; else if (v < 0) srn[b]++; if (v) relVals.push(v); }
    for (let i = 0; i < scope.length; i++) for (let j = i + 1; j < scope.length; j++) if (R(c, scope[i], scope[j]) > 0 && R(c, scope[j], scope[i]) > 0) sMutual++;
  }
  const avgRel = relVals.length ? relVals.reduce((s, v) => s + v, 0) / relVals.length : null;
  return { rp, rn, mutual, scoped, scope, srp, srn, sMutual, avgRel, relCount: relVals.length };
}

  if (n) { const rp = toScreen(cls().pos[drag.id]); drag.ox = rp.x - q.x; drag.oy = rp.y - q.y; }

/* Mausrad über der Zeichenfläche: zoomt um den Mauszeiger herum (der Punkt darunter bleibt an Ort und Stelle) –
   es werden nur die Positionen gestreckt/gestaucht, Kreise, Schrift und Linien behalten ihre feste Größe */
tabSocio.addEventListener("wheel", e => {
  const svg = e.target.closest("#socio"); if (!svg) return;
  e.preventDefault();
  const q = svgPt(e), z0 = socioZ(), z1 = Math.max(SOCIO_ZOOM_MIN, Math.min(SOCIO_ZOOM_MAX, z0 * Math.exp(-e.deltaY * 0.0016)));
  if (Math.abs(z1 - z0) < 1e-6) return;
  const lp = toLogical(q);
  camAnim++; // eine laufende Auto-Zoom-Animation abbrechen, damit sie das manuelle Zoomen nicht überschreibt
  ui.socioZoom = z1;
  ui.socioPan = { x: lp.x - (q.x - SW / 2) / z1, y: lp.y - (q.y - SH / 2) / z1 };
  drawSocio();
}, { passive: false });
tabSocio.addEventListener("pointermove", e => {
  if (drag) {
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
    drag.moved = true;
    if (drag.id) {
      const q = svgPt(e), z = socioZ(), rx = q.x + drag.ox, ry = q.y + drag.oy;
      const lx = (rx - SW / 2) / z + socioCam().x, ly = (ry - SH / 2) / z + socioCam().y;
      cls().pos[drag.id] = { x: Math.max(24, Math.min(SW - 24, lx)), y: Math.max(24, Math.min(SH - 24, ly)) };
      drawSocio();
    } else if (drag.pan) {
      const q = svgPt(e), z = socioZ(), dx = q.x - drag.panStart.x, dy = q.y - drag.panStart.y;
      camAnim++; // ein laufendes Auto-Zoom-Animieren abbrechen, damit es das manuelle Verschieben nicht überschreibt
      ui.socioPan = { x: drag.camStart.x - dx / z, y: drag.camStart.y - dy / z };
      drawSocio();
    }
    return;
  }
  const n = e.target.closest && e.target.closest("#socio .node"), id = n ? n.dataset.id : null;
  if (id !== ui.hover) { ui.hover = id; if (!ui.sel.size) drawSocio(); }

  free.forEach((k, i) => { room.desks[k].sid = best[i] >= 0 ? c.students[best[i]].id : null; });
  return { ok: true };
}

/* --- Raum: Größe direkt eingeben (statt schrittweise über die Rand-Knöpfe) --- */
/* Wächst/schrumpft am Rand, der von der Tafel am weitesten entfernt ist (unten/rechts), damit die
   bestehende Anordnung nahe der Tafel erhalten bleibt. Tische, die dabei wegfallen, werden entfernt. */
function setRoomSize(cols, rows) {
  const c = cls(), room = c.room;
  cols = Math.max(1, Math.min(60, Math.round(cols) || room.cols));
  rows = Math.max(1, Math.min(60, Math.round(rows) || room.rows));
  if (cols === room.cols && rows === room.rows) return;
  const lost = Object.keys(room.desks).filter(k => { const p = dpos(k); return p.c >= cols || p.r >= rows; });
  if (lost.some(k => room.desks[k].sid)) toast("Achtung: Schüler an entfernten Tischen sind jetzt nicht platziert.");
  roomSnap();
  for (const k of lost) delete room.desks[k];
  if (room.blocked) for (const k of Object.keys(room.blocked)) { const p = dpos(k); if (p.c >= cols || p.r >= rows) delete room.blocked[k]; }
  room.cols = cols; room.rows = rows;
  ui.deskSel = null; save(); renderRoom();
}

/* --- Standard-Tischanordnungen --- */
/* Formt einen Gruppentisch für m Plätze: möglichst zwei Spalten breit, wie zusammengeschobene Tische. */
function blockShape(m) { const w = m <= 1 ? 1 : 2; return { w, h: Math.ceil(m / w) }; }
/* Legt eine der vier Standard-Tischanordnungen im aktuellen, vom Benutzer vorgegebenen Raster an
   (room.cols × room.rows bleiben unverändert – der Raum ist nicht flexibel). Ersetzt alle Tische und
   damit die Sitzordnung; eine eigene, frei angeordnete Aufstellung lässt sich separat unter „Vorlagen“
   dauerhaft in der Klasse speichern und jederzeit wieder laden.
   Wichtig für Einzel- und Doppeltische: Alle Schüler blicken nach vorne (Spalte 0, wo die Tafel steht).
   Der Stuhl steht dabei in der Zelle HINTER dem Tisch (eine Spalte weiter von der Tafel weg) – deshalb
   wechseln sich Tisch- und Gangspalten ab, sonst stünde dort der nächste Tisch. Bei Doppeltischen bilden
   zusätzlich je zwei benachbarte Reihen einen gemeinsamen Tisch, mit einer freien Reihe dazwischen, damit
   man zwischen die Tischpaare gelangt. Jede „Einheit“ unten ist ein Tisch (Einzel-/U-Form) oder eine
   Gruppe zusammengehöriger Tische (Doppel-/Gruppentisch), die bei „Verfügbare Tische“ zusammen gezählt,
   aber notfalls auch angeschnitten wird. */
function applyStandardLayout(kind) {
  const c = cls(), room = c.room, cols = room.cols, rows = room.rows;
  if (cols < 1 || rows < 1) { toast("Der Raum hat keine Größe."); return; }
  if (kind === "u" && (cols < 4 || rows < 4)) { toast("Für eine U-Form braucht der Raum mindestens 4 Spalten und 4 Reihen."); return; }
  /* Gesperrte Felder (per Rechtsklick markiert) dürfen weder einen Tisch noch einen Stuhl bekommen */
  const free = (cc, rr) => !isBlockedCell(room, cc, rr);
  const units = []; let label = "";
  if (kind === "single") {
    label = "Einzeltische";
    for (let cc = 0; cc < cols - 1; cc += 2) for (let r = 0; r < rows; r += 2)
      if (free(cc, r) && free(cc + 1, r)) units.push([{ c: cc, r, dir: "left" }]);
  } else if (kind === "row") {
    label = "Reihen";
    /* Wie Einzeltische, aber ohne Lücke zwischen den Reihen – klassische durchgehende Sitzreihen. */
    for (let cc = 0; cc < cols - 1; cc += 2) for (let r = 0; r < rows; r++)
      if (free(cc, r) && free(cc + 1, r)) units.push([{ c: cc, r, dir: "left" }]);
  } else if (kind === "double") {
    label = "Doppeltische";
    /* Sucht je Spaltenpaar zwei aufeinanderfolgende freie Reihen für einen echten Doppeltisch; eine
       gesperrte Reihe wirkt dabei wie eine natürliche Lücke (kein zusätzlicher Abstand nötig) und wird
       einfach übersprungen, statt – wie zuvor – neben ihr einen einzelnen, unverpaarten Tisch stehen zu
       lassen. Nach einem gesetzten Paar folgt weiterhin eine Gangreihe, bevor das nächste Paar gesucht wird. */
    for (let cc = 0; cc < cols - 1; cc += 2) {
      let r = 0;
      while (r < rows) {
        if (!free(cc, r) || !free(cc + 1, r)) { r++; continue; }
        if (r + 1 < rows && free(cc, r + 1) && free(cc + 1, r + 1)) {
          units.push([{ c: cc, r, dir: "left" }, { c: cc, r: r + 1, dir: "left" }]);
          r += 3;
        } else r++;
      }
    }
  } else if (kind === "u") {
    label = "U-Form";
    /* Offene Seite zeigt zur Tafel (Spalte 0 bleibt frei): rechte Tischspalte liegt bei cols-2, damit die
       Stühle (eine Spalte weiter, bei cols-1) noch ein echtes, freies Feld im Raum haben. Obere und untere
       Tischreihe liegen entsprechend bei Reihe 1 bzw. rows-2, mit freier Stuhl-Reihe bei 0 bzw. rows-1.
       Ist diese äußere Stuhl-Reihe/-Spalte gesperrt (z. B. eine ganz gesperrte Rand-Reihe für eine Wand),
       schaut der Tisch stattdessen nach innen, damit der jeweilige Arm nicht komplett wegfällt – nur an den
       Ecken (wo sich Arme sonst überschneiden würden) bleibt es bei „kein Platz“. */
    const rightCol = cols - 2, topRow = 1, botRow = rows - 2;
    for (let r = topRow; r <= botRow; r++) {
      if (!free(rightCol, r)) continue;
      if (free(rightCol + 1, r)) units.push([{ c: rightCol, r, dir: "left" }]);
      else if (r > topRow && r < botRow && free(rightCol - 1, r)) units.push([{ c: rightCol, r, dir: "right" }]);
    }
    for (let cc = 1; cc < rightCol; cc++) {
      if (free(cc, topRow)) {
        if (free(cc, topRow - 1)) units.push([{ c: cc, r: topRow, dir: "down" }]);
        else if (topRow + 1 < botRow && free(cc, topRow + 1)) units.push([{ c: cc, r: topRow, dir: "up" }]);
      }
      if (free(cc, botRow)) {
        if (free(cc, botRow + 1)) units.push([{ c: cc, r: botRow, dir: "up" }]);
        else if (botRow - 1 > topRow && free(cc, botRow - 1)) units.push([{ c: cc, r: botRow, dir: "down" }]);
      }
    }
  } else if (kind === "group") {
    label = "Gruppentische";
    const size = ui.roomGenSize || 4, { w: bw, h: bh } = blockShape(size);
    for (let y = 0; y < rows; y += bh + 1) for (let x = 0; x < cols; x += bw + 1) {
      const w = Math.min(bw, cols - x), h = Math.min(bh, rows - y), cells = [];
      for (let r = 0; r < h; r++) for (let cx = 0; cx < w; cx++) if (free(x + cx, y + r)) cells.push({ c: x + cx, r: y + r, dir: "left" });
      if (cells.length) units.push(cells.slice(0, size));
    }
  } else return;
  const cap = room.deskCount > 0 ? room.deskCount : null;
  const desks = {}; let n = 0;
  for (const unit of units) {
    if (cap != null && n >= cap) break;
    const take = cap != null ? Math.min(unit.length, cap - n) : unit.length;
    unit.slice(0, take).forEach(d => { desks[dk(d.c, d.r)] = { sid: null, locked: false, dir: d.dir }; n++; });
  }
  if (!n) { toast(cap === 0 ? "Es sind 0 Tische verfügbar – unter „Raum“ anpassen." : "Dafür ist das Raster zu klein."); return; }
  roomSnap();
  c.room.desks = desks;
  if (kind === "group") {
    for (const k in desks) applyClusterDefault(c.room, k);
    for (const k in desks) fixBlockedNeighborChairs(c.room, k);
    /* Tische ohne freie Stuhlseite (rundum durch gesperrte Felder oder Nachbartische eingeschlossen)
       wurden dabei wieder entfernt – die tatsächliche Anzahl kann daher kleiner sein als n. */
    n = Object.keys(c.room.desks).length;
  }
  ui.deskSel = null; save(); renderRoom();
  if (!n) { toast("Dafür ist bei diesem Raster kein Platz mit freier Stuhlseite übrig."); return; }
  toast(`${label} angelegt (${n} Tisch${n === 1 ? "" : "e"} im ${cols}×${rows}-Raster${cap != null ? `, begrenzt auf ${cap} verfügbare` : ""}). Rückgängig möglich.`);
}

/* --- Sitzplatzwünsche: Kürzel und Prüfung --- */
const SEAT_BADGE_LETTER = { single: "E", double: "D", group: "G", front: "V", mid: "M", back: "H" };
function seatBadge(s) {
  const pr = s.seat; if (!seatHasPref(pr)) return "";
  const parts = [];
  const dt = SEAT_DESK_FIELDS.filter(f => pr[f] !== false), rw = SEAT_ROW_FIELDS.filter(f => pr[f] !== false);
  if (dt.length < 3) parts.push(dt.map(f => SEAT_BADGE_LETTER[f]).join(""));
  if (rw.length < 3) parts.push(rw.map(f => SEAT_BADGE_LETTER[f]).join(""));
  if (pr.outward) parts.push("A");
  return parts.length ? ` <span class="muted" style="font-weight:400;font-size:9px">(${parts.join(" ")})</span>` : "";
}
/* Prüft den Sitzplatzwunsch des Schülers am Tisch k gegen dessen aktuelle Position: null = kein Wunsch geäußert, [] = Wunsch erfüllt, sonst Liste der nicht erfüllten Punkte */
function seatPrefBad(c, room, k) {
  const d = room.desks[k]; if (!d || !d.sid) return null;
  const s = stOf(c, d.sid), pr = s.seat; if (!seatHasPref(pr)) return null;
  const p = dpos(k), bad = [];
  const band = rowBandOf(room, p.c), bandLabel = { front: "vorne", mid: "in der Mitte", back: "hinten" };
  if (pr[band] === false) bad.push(bandLabel[band] + " nicht gewünscht");
  const cat = deskCategory(room, k), catLabel = { single: "Einzeltisch", double: "Doppeltisch", group: "Gruppentisch" };
  if (pr[cat] === false) bad.push(catLabel[cat] + " nicht gewünscht");
  if (pr.outward) { const ed = Math.min(p.c, room.cols - 1 - p.c, p.r, room.rows - 1 - p.r); if (ed > 0) bad.push("Blick nach außen gewünscht"); }
  return bad;
}
function seatPrefStats(c) {
  const room = c.room;
  let total = 0, unmet = 0; const seatedIds = new Set();
  for (const k in room.desks) {
    const d = room.desks[k]; if (!d.sid) continue;
    seatedIds.add(d.sid);
    const bad = seatPrefBad(c, room, k); if (bad === null) continue;
    total++;
    if (bad.length) unmet++;
  }
  for (const s of c.students) {
    if (seatedIds.has(s.id) || !seatHasPref(s.seat)) continue;
    total++; unmet++;
  }
  return { total, unmet };
}

/* Gewichte für Sitzplatzwunsch-Punkte – gemeinsam genutzt von "Sitzordnung berechnen" (optimizeSeating) und der Score-Anzeige (seatPrefScore), damit beide immer dieselben Werte verwenden */
const SEATPREF_ROW_W = 4, SEATPREF_OUT_W = .9, SEATPREF_DESKTYPE_W = 6;
function seatPrefScore(c) {
  const room = c.room; let pen = 0;
  for (const k in room.desks) {
    const d = room.desks[k]; if (!d.sid) continue;
    const pr = stOf(c, d.sid).seat; if (!seatHasPref(pr)) continue;
    const p = dpos(k);
    if (pr[rowBandOf(room, p.c)] === false) pen += SEATPREF_ROW_W;
    if (pr[deskCategory(room, k)] === false) pen += SEATPREF_DESKTYPE_W;
    if (pr.outward) pen += Math.min(p.c, room.cols - 1 - p.c, p.r, room.rows - 1 - p.r) * SEATPREF_OUT_W;
  }
  return -pen;
}
/* --- Score: Zuneigung in der Nähe erhöht, Abneigung in der Nähe senkt ihn (gleiche Gewichte wie die Berechnung); Blickrichtung und Sitzplatzwünsche fließen als eigene Anteile ein --- */
function seatScore(c, negW, sight) {
  const room = c.room, seated = Object.keys(room.desks).filter(k => room.desks[k].sid).map(k => ({ id: room.desks[k].sid, p: dpos(k), dir: room.desks[k].dir || "left" }));
  let like = 0, dis = 0, sightPts = 0, max = 0;
  for (let i = 0; i < seated.length; i++) for (let j = i + 1; j < seated.length; j++) {
    const a = seated[i], b = seated[j], va = R(c, a.id, b.id), vb = R(c, b.id, a.id), d = dist(a.p, b.p);
    const sf = sight ? sightFactor(a.dir, b.dir, a.p, b.p) : 1;
    const p = Math.max(va, 0), q = Math.max(vb, 0), P = (p + q) * (p && q ? 1.5 : 1), N = (Math.max(-va, 0) + Math.max(-vb, 0));
    like += P * gfun(d); dis += negW * N * hfun(d); max += P;
    sightPts += (P * sf - P) * gfun(d) - negW * (N * sf - N) * hfun(d);
  }
  const pref = seatPrefScore(c);
  return { like, dis, sight: sightPts, pref, score: like - dis + sightPts + pref, max };
}
const fmtN = (x, sign) => (sign && x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1).replace(".", ",");

const ROOM_MIN_CELL = 30, ROOM_MAX_CELL = 130;
function fitRoomZoom() {

  const top = stage.getBoundingClientRect().top;

  let out = "";

}

/* Beziehungs-Rad für den Tisch-Dialog: der ausgewählte Schüler in der Mitte, alle anderen im Kreis drumherum; Kanten wie im Soziogramm (Farbe/Stärke nach Beziehungswert, Pfeilrichtung, dick mit Pfeilspitzen an beiden Enden = gegenseitig) */

/* ---------- Tische/Felder "zeichnen": gedrückte Maustaste über mehrere Felder ziehen ----------
   Linksklick gedrückt halten und über leere Felder ziehen setzt dort reihenweise Tische (wie mehrfaches
   Anklicken); Rechtsklick gedrückt halten und ziehen wendet auf jedem Feld dieselbe Aktion wie ein
   einzelner Rechtsklick an (Tisch/Schüler entfernen bzw. leeres Feld sperren/entsperren). Ein normaler,
   nicht gezogener Klick bzw. Rechtsklick bleibt unverändert (die eigentliche Aktion übernehmen weiterhin
   die obigen "click"/"contextmenu"-Handler) – erst eine tatsächliche Mausbewegung auf ein anderes Feld
   startet das "Malen"; dabei wird pro Zug nur eine einzige Rückgängig-Stufe angelegt, und jedes Feld wird
   je Zug nur einmal bearbeitet (sonst würde erneutes Überstreichen z. B. eine Sperrung wieder aufheben).
   Damit der abschließende Klick/Rechtsklick beim Loslassen nicht zusätzlich auf dem letzten Feld auslöst,
   wird er nach einem echten Zug einmalig unterdrückt. */
let paintDrag = null, suppressClickAfterPaint = false, suppressCtxAfterPaint = false;

/* Tisch samt Schüler verschieben (per Drag & Drop eines sitzenden Schülers auf ein anderes Feld) */
function moveDesk(from, to) {
  const room = cls().room; if (from === to) return;
  const a = room.desks[from], b = room.desks[to]; if (!a) return;
  if (a.locked) { toast("Dieser Tisch ist gesperrt und bleibt an seinem Platz."); return; }
  if (b && b.locked) { toast("Der Zieltisch ist gesperrt."); return; }
  if (!b && isBlockedCell(room, dpos(to).c, dpos(to).r)) { toast("Dieses Feld ist gesperrt (Rechtsklick zum Entsperren)."); return; }
  roomSnap();
  if (b) { room.desks[from] = b; room.desks[to] = a; } else { delete room.desks[from]; room.desks[to] = a; }
  fixBlockedNeighborChairs(room, to); if (b) fixBlockedNeighborChairs(room, from);
  /* Der verschobene Tisch (und beim Tausch auch sein Partner) braucht an der neuen Stelle selbst
     wieder einen gültigen Stuhlplatz – sonst kann der Stuhl am Rand/in der Ecke aus dem Raster ragen */
  if (!chairSpotFree(room, to, a.dir || "left")) a.dir = nextChairDir(room, to, a.dir || "left");
  if (b && !chairSpotFree(room, from, b.dir || "left")) b.dir = nextChairDir(room, from, b.dir || "left");
  if (ui.deskSel === from) ui.deskSel = to; else if (ui.deskSel === to) ui.deskSel = from;
  save(); renderRoom();
}

/* ============ Umfrage-Modus (Schülerzugang, im Tab "Schüler") – gemeinsames Gerät ============ */
const DEFAULT_PROMPT = "Wie gern bist du mit diesen Personen zusammen – zum Beispiel beim Arbeiten oder Sitzen?";
const KIOSK_SCALE = [{ v: 2, t: "Sehr gern" }, { v: 1, t: "Gern" }, { v: -1, t: "Eher nicht" }, { v: -2, t: "Gar nicht" }];

function access(c) {
  const a = c.access = c.access || {};

  if (a.askMood === undefined) a.askMood = true;

  return a;
}

function accessBody(c) {
  const a = access(c), N = c.students.length;
  if (N < 2) return `<p class="small muted" style="margin:0">Lege mindestens zwei Schüler an, um den Umfrage-Modus zu nutzen.</p>`;
  const done = c.students.filter(s => a.done[s.id]).length;
  const hasAnswers = Object.keys(c.rel).length > 0 || Object.keys(c.mood || {}).length > 0 || c.students.some(s => s.seat);
  return `<div class="field" style="margin:0 0 12px"><label for="accPrompt">Fragestellung</label><input id="accPrompt" class="txt" value="${esc(a.prompt)}"></div>
    <label class="chk"><input type="checkbox" id="accAskMood"${a.askMood ? " checked" : ""}> Zufriedenheit abfragen</label>
    <label class="chk"><input type="checkbox" id="accAskSeat"${a.askSeat ? " checked" : ""}> Sitzplatzwünsche abfragen</label>
    <p class="small muted" style="margin:6px 0 12px">${done} von ${N} Schülern haben schon geantwortet.</p>
    <div class="row"><button class="btn primary" id="accStart" type="button">Umfrage starten</button></div>
    ${hasAnswers ? `<p class="small muted" style="margin:14px 0 0"><button class="btn sm danger" id="accClearAll" type="button" title="Löscht alle Beziehungs-, Sitzplatzwunsch- und Zufriedenheitsangaben dieser Klasse, auch den Status „schon geantwortet“.">Alle Antworten löschen</button></p>` : ""}`;
}

/* ---------- Umfrage-Modus (Kiosk) ---------- */
let kiosk = null;   // { sid, ans } während ein Kind gerade antwortet; null = Namensauswahl
function openKiosk() {
  kiosk = null;
  const ov = document.createElement("div");
  ov.id = "kiosk";
  ov.style.cssText = "position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto";
  ov.addEventListener("click", async e => {
    const who = e.target.closest("[data-who]");
    if (who) {
      const c = cls(); kiosk = { sid: who.dataset.who, ans: {} };
      for (const o of c.students) { const v = R(c, kiosk.sid, o.id); if (v) kiosk.ans[o.id] = v; }
      kiosk.mood = (c.mood && c.mood[kiosk.sid] && c.mood[kiosk.sid].v) || 0;
      kiosk.seat = { ...(stOf(c, kiosk.sid).seat || {}) };
      renderKiosk(); return;
    }
    const mopt = e.target.closest("#moodOpts button");
    if (mopt) {
      const v = +mopt.dataset.v;
      kiosk.mood = kiosk.mood === v ? 0 : v;
      $$("button", mopt.closest("#moodOpts")).forEach(b => b.classList.toggle("on", +b.dataset.v === kiosk.mood));
      renderKioskProgress(); return;
    }
    const kseat = e.target.closest("[data-kseat]");
    if (kseat) {
      const f = kseat.dataset.kseat;
      kiosk.seat[f] = !kiosk.seat[f];
      kseat.classList.toggle("on", !!kiosk.seat[f]);
      return;
    }
    const opt = e.target.closest(".kiosk-opts button");
    if (opt) {
      const box = opt.closest(".kiosk-opts"), oid = box.dataset.for, v = +opt.dataset.v;
      kiosk.ans[oid] = kiosk.ans[oid] === v ? 0 : v;
      $$("button", box).forEach(b => b.classList.toggle("on", +b.dataset.v === kiosk.ans[oid]));
      renderKioskProgress(); return;
    }
    if (e.target.id === "kioskBack") { kiosk = null; renderKiosk(); return; }
    if (e.target.id === "kioskDone") {
      const c = cls(), a = access(c), name = stOf(c, kiosk.sid).name, others = c.students.filter(o => o.id !== kiosk.sid);
      const missing = others.filter(o => !kiosk.ans[o.id]).length;
      if (missing || (a.askMood && !kiosk.mood)) { toast("Bitte beantworte zuerst alle Angaben, bevor du fertig bist."); return; }
      relSnap(c);
      for (const o of others) setR(c, kiosk.sid, o.id, kiosk.ans[o.id]);
      if (a.askMood) moods(c)[kiosk.sid] = { v: kiosk.mood, at: new Date().toISOString() };
      if (a.askSeat) {
        // Fragebogen startet leer (nichts vorausgewählt): eine Kategorie gilt nur als eingeschränkt,
        // wenn darin mindestens etwas angetippt wurde – sonst bleibt sie offen (keine Einschränkung)
        const s = stOf(c, kiosk.sid), seat = {};
        if (kiosk.seat.outward) seat.outward = true;
        if (SEAT_DESK_FIELDS.some(f => kiosk.seat[f])) for (const f of SEAT_DESK_FIELDS) seat[f] = !!kiosk.seat[f];
        if (SEAT_ROW_FIELDS.some(f => kiosk.seat[f])) for (const f of SEAT_ROW_FIELDS) seat[f] = !!kiosk.seat[f];
        s.seat = seat;
        if (!seatHasPref(s.seat)) delete s.seat;
      }
      a.done[kiosk.sid] = new Date().toISOString();
      save(); kiosk = null; renderKiosk();
      toast("Danke, " + name + "!"); return;
    }
    if (e.target.id === "kioskExit") {
      if (await askConfirm("Umfrage beenden?", "Zurück zur Lehrkraft-Ansicht.", "Beenden")) closeKiosk();
      return;
    }
  });
  document.body.appendChild(ov);
  renderKiosk();
}
function closeKiosk() {
  const ov = $("#kiosk"); if (ov) ov.remove();
  kiosk = null; renderStudents();
}
function renderKioskProgress() {
  const c = cls(), a = access(c), others = c.students.filter(x => x.id !== kiosk.sid), n = others.filter(o => kiosk.ans[o.id]).length, missing = others.length - n;
  const moodOpen = a.askMood && !kiosk.mood;
  const p = $("#kioskProgress"); if (p) p.textContent = n + " von " + others.length + " beantwortet" + (moodOpen ? " · „Wie geht es dir?“ noch offen" : "");
  const btn = $("#kioskDone"); if (btn) btn.disabled = missing > 0 || moodOpen;
}
function renderKiosk() {
  const ov = $("#kiosk"); if (!ov) return;
  const c = cls(), a = access(c);
  if (!kiosk) {
    const sorted = [...c.students].sort((x, y) => x.name.localeCompare(y.name, "de"));
    ov.innerHTML = `<div style="max-width:520px;margin:0 auto;padding:24px 16px 40px">
      <h1 style="font-size:24px;margin-bottom:6px">Wer bist du?</h1>
      <p class="muted small" style="margin:0 0 18px">Tippe auf deinen Namen.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${sorted.map(s => `<button class="btn" data-who="${s.id}" type="button" style="text-align:left;padding:14px 16px;font-size:16px;display:flex;justify-content:space-between;align-items:center">${esc(s.name)}${a.done[s.id] ? '<span class="small ok">✓</span>' : ""}</button>`).join("")}
      </div>
      <p style="margin-top:28px;text-align:center"><button class="btn sm" id="kioskExit" type="button">Umfrage beenden (nur Lehrkraft)</button></p>
    </div>`;
    return;
  }
  const s = stOf(c, kiosk.sid), others = c.students.filter(x => x.id !== kiosk.sid), doneCount = others.filter(o => kiosk.ans[o.id]).length, missing = others.length - doneCount;
  const moodOpen = a.askMood && !kiosk.mood;
  ov.innerHTML = `<div style="max-width:560px;margin:0 auto;padding:24px 16px 90px">
    <h1 style="font-size:24px;margin-bottom:4px">Hallo ${esc(s.name)}!</h1>
    <p class="muted small" id="kioskProgress" style="margin:0 0 14px">${doneCount} von ${others.length} beantwortet${moodOpen ? " · „Wie geht es dir?“ noch offen" : ""}</p>
    ${a.askMood ? `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px;background:var(--surface2)">
      <div style="font-weight:600;margin-bottom:6px">Wie geht es dir gerade?</div>
      <div class="kiosk-opts" id="moodOpts">${MOOD_SCALE.map(k => `<button type="button" data-v="${k.v}" class="${kiosk.mood === k.v ? "on" : ""}">${k.t}</button>`).join("")}</div>
    </div>` : ""}
    ${a.askSeat ? `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px;background:var(--surface2)">
      <div style="font-weight:600;margin-bottom:6px">Wie möchtest du am liebsten sitzen?</div>
      <p class="small muted" style="margin:0 0 8px">Nichts ist vorausgewählt. Tippe nur das an, was dir wichtig ist – ist dir bei einer Frage nichts davon wichtig, lass sie einfach frei.</p>
      <p class="small" style="margin:0 0 4px"><b>Tischgruppe</b></p>
      <div class="kiosk-opts" style="grid-template-columns:repeat(3,1fr)">${SEAT_DESK_OPTS.map(([f, n]) => `<button type="button" data-kseat="${f}" class="${kiosk.seat[f] ? "on" : ""}">${n}</button>`).join("")}</div>
      <p class="small" style="margin:10px 0 4px"><b>Nähe zur Tafel</b></p>
      <div class="kiosk-opts" style="grid-template-columns:repeat(3,1fr)">${SEAT_ROW_OPTS.map(([f, n]) => `<button type="button" data-kseat="${f}" class="${kiosk.seat[f] ? "on" : ""}">${n}</button>`).join("")}</div>
      <div class="kiosk-opts" style="grid-template-columns:1fr;margin-top:10px"><button type="button" data-kseat="outward" class="${kiosk.seat.outward ? "on" : ""}">Blick nach außen erwünscht</button></div>
    </div>` : ""}
    <p style="font-weight:600;margin:0 0 14px">${esc(a.prompt)}</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${others.map(o => `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px">
        <div style="font-weight:600;margin-bottom:4px">${esc(o.name)}</div>
        <div class="kiosk-opts" data-for="${o.id}">${KIOSK_SCALE.map(k => `<button type="button" data-v="${k.v}" class="${kiosk.ans[o.id] === k.v ? "on" : ""}">${k.t}</button>`).join("")}</div>
      </div>`).join("")}
    </div>
    <div style="position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:center">
      <button class="btn" id="kioskBack" type="button">Zurück</button>
      <button class="btn primary" id="kioskDone" type="button"${missing > 0 || moodOpen ? " disabled" : ""}>Fertig</button>
    </div>
  </div>`;
}

$("#tab-students").addEventListener("change", e => {
  const c = cls(), a = access(c), t = e.target;
  if (t.id === "accPrompt") { a.prompt = t.value.trim() || DEFAULT_PROMPT; save(); renderStudents(); }
  else if (t.id === "accAskMood") { a.askMood = t.checked; save(); renderStudents(); }
  else if (t.id === "accAskSeat") { a.askSeat = t.checked; save(); renderStudents(); }
});
$("#tab-students").addEventListener("click", async e => {
  const c = cls(), a = access(c), t = e.target;
  switch (t.id) {
    case "accStart": openKiosk(); break;
    case "accClearAll": {
      if (!Object.keys(c.rel).length && !Object.keys(c.mood || {}).length && !c.students.some(s => s.seat)) { toast("Es sind keine Antworten vorhanden."); return; }
      if (!await askConfirm("Alle Antworten löschen?", "Alle Beziehungs-, Sitzplatzwunsch- und Zufriedenheitsangaben dieser Klasse werden gelöscht, auch der Status „schon geantwortet“. Du kannst das rückgängig machen.", "Alle löschen")) return;
      relSnap(c); c.rel = {}; c.mood = {}; a.done = {}; for (const s of c.students) delete s.seat;
      save(); render(); toast("Alle Antworten gelöscht – rückgängig möglich."); break;
    }
  }
});

/* ============ Start ============ */
S = loadState();
syncSettingsToUi(cls());
$("#saveState").textContent = storageOK ? "Automatisch gespeichert – nur in diesem Browser, nicht online. Für ein Backup: „Sichern / Laden“." : "Automatisches Speichern ist hier nicht möglich. Bitte regelmäßig über „Sichern / Laden“ eine Datei speichern.";
render();

})();
</script></body></html>
